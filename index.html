<!-- index.html -->
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CajaPRO</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="app">

    <!-- =========================
         🏠 INICIO
    ========================== -->

    <section
      id="inicio"
      class="pantalla activa"
    >

      <!-- HEADER -->

      <div class="header">

        <div class="header-top">

          <div>

            <p class="mini">
              CajaPRO
            </p>

            <h1 id="ganancia">
              S/ 0
            </h1>

            <span id="estado">
              Iniciando...
            </span>

          </div>

          <div class="logo-circle">
            💰
          </div>

        </div>

      </div>

      <!-- CARDS -->

      <div class="cards">

        <div class="card">

          <span>
            Ventas
          </span>

          <b id="ventas">
            S/ 0
          </b>

        </div>

        <div class="card">

          <span>
            Transacciones
          </span>

          <b id="transacciones">
            0
          </b>

        </div>

      </div>

      <!-- PRODUCTO TOP -->

      <div
        id="topProducto"
        class="destacado"
      ></div>

      <!-- DASHBOARD -->

      <div id="dashboardPro"></div>

      <!-- VENTA RÁPIDA -->

      <div class="seccion">

        <h3>
          Venta rápida
        </h3>

        <div class="rapido">

          <button
            onclick="ventaRapida(5)"
          >
            + S/5
          </button>

          <button
            onclick="ventaRapida(10)"
          >
            + S/10
          </button>

          <button
            onclick="ventaRapida(20)"
          >
            + S/20
          </button>

        </div>

      </div>

      <!-- MÉTODO -->

      <div class="seccion">

        <h3>
          Método de pago
        </h3>

        <select id="metodo">

          <option value="efectivo">
            💵 Efectivo
          </option>

          <option value="yape">
            📱 Yape
          </option>

          <option value="plin">
            📲 Plin
          </option>

        </select>

      </div>

    </section>

    <!-- =========================
         📦 PRODUCTOS
    ========================== -->

    <section
      id="productosTab"
      class="pantalla"
    >

      <div class="seccion">

        <div class="titulo-row">

          <h2>
            Productos
          </h2>

          <button
            class="mini-btn"
            onclick="abrirModalNuevo()"
          >
            + Nuevo
          </button>

        </div>

        <div id="productos"></div>

      </div>

    </section>

    <!-- =========================
         📜 HISTORIAL
    ========================== -->

    <section
      id="historialTab"
      class="pantalla"
    >

      <div class="seccion">

        <div class="titulo-row">

          <h2>
            Historial
          </h2>

          <button
            class="mini-btn"
            onclick="exportar()"
          >
            Descargar
          </button>

        </div>

        <div id="historial"></div>

      </div>

    </section>

  </div>

  <!-- =========================
       🔻 NAVBAR
  ========================== -->

  <div class="navbar">

    <button
      onclick="cambiarTab('inicio')"
    >
      🏠
    </button>

    <button
      onclick="cambiarTab('productosTab')"
    >
      📦
    </button>

    <button
      onclick="cambiarTab('historialTab')"
    >
      📊
    </button>

  </div>

  <!-- =========================
       ✨ MODAL
  ========================== -->

  <div
    id="modal"
    class="modal"
  >

    <div class="modal-box">

      <div class="titulo-row">

        <h2 id="modalTitulo">
          Producto
        </h2>

        <button
          class="cerrar"
          onclick="cerrarModal()"
        >
          ✕
        </button>

      </div>

      <input
        id="mNombre"
        placeholder="Nombre"
      />

      <input
        id="mCategoria"
        placeholder="Categoría"
      />

      <input
        id="mPrecio"
        type="number"
        placeholder="Precio"
      />

      <input
        id="mCosto"
        type="number"
        placeholder="Costo"
      />

      <input
        id="mStock"
        type="number"
        placeholder="Stock"
      />

      <input
        id="mAgregarStock"
        type="number"
        placeholder="Agregar stock"
      />

      <button
        class="btn-full"
        onclick="guardarProductoModal()"
      >
        Guardar
      </button>

    </div>

  </div>

  <!-- MENSAJE -->

  <div
    id="mensaje"
    class="mensaje"
  ></div>

  <script src="app.js"></script>

</body>

</html>
