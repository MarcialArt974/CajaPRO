<!-- index.html -->
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CajaPRO</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="app">

    <!-- =========================
         🏠 INICIO
    ========================== -->

    <div
      id="inicio"
      class="pantalla activa"
    >

      <!-- 💰 HEADER -->

      <div class="header">

        <div class="header-top">

          <div>

            <p class="mini">
              CajaPRO
            </p>

            <h1 id="ganancia">
              S/ 0
            </h1>

            <span id="estado">
              Iniciando...
            </span>

          </div>

          <div class="logo-circle">
            💰
          </div>

        </div>

      </div>

      <!-- 📊 CARDS -->

      <div class="cards">

        <div class="card">

          <span>
            Ventas
          </span>

          <b id="ventas">
            S/ 0
          </b>

        </div>

        <div class="card">

          <span>
            Transacciones
          </span>

          <b id="transacciones">
            0
          </b>

        </div>

      </div>

      <!-- 🔥 PRODUCTO TOP -->

      <div
        id="topProducto"
        class="destacado"
      ></div>

      <!-- 📊 DASHBOARD -->

      <div id="dashboardPro"></div>

      <!-- ⚡ VENTA RÁPIDA -->

      <div class="seccion">

        <h3>
          Venta rápida
        </h3>

        <div class="rapido">

          <button
            onclick="ventaRapida(5)"
          >
            + S/5
          </button>

          <button
            onclick="ventaRapida(10)"
          >
            + S/10
          </button>

          <button
            onclick="ventaRapida(20)"
          >
            + S/20
          </button>

        </div>

      </div>

      <!-- 💳 MÉTODO -->

      <div class="seccion">

        <h3>
          Método de pago
        </h3>

        <select id="metodo">

          <option value="efectivo">
            💵 Efectivo
          </option>

          <option value="yape">
            📱 Yape
          </option>

          <option value="plin">
            📲 Plin
          </option>

        </select>

      </div>

    </div>

    <!-- =========================
         📦 PRODUCTOS
    ========================== -->

    <div
      id="productosTab"
      class="pantalla"
    >

      <div class="seccion">

        <h2>
          Productos
        </h2>

        <div id="productos"></div>

      </div>

      <!-- ➕ AGREGAR -->

      <div class="seccion">

        <h3>
          Agregar producto
        </h3>

        <input
          id="nombre"
          placeholder="Nombre del producto"
        />

        <input
          id="precio"
          type="number"
          placeholder="Precio"
        />

        <input
          id="costo"
          type="number"
          placeholder="Costo"
        />

        <input
          id="stock"
          type="number"
          placeholder="Stock"
        />

        <button
          class="btn-full"
          onclick="agregarProducto()"
        >
          Agregar producto
        </button>

      </div>

    </div>

    <!-- =========================
         📜 HISTORIAL
    ========================== -->

    <div
      id="historialTab"
      class="pantalla"
    >

      <div class="seccion">

        <div class="titulo-row">

          <h2>
            Historial
          </h2>

          <button
            class="mini-btn"
            onclick="exportar()"
          >
            Descargar
          </button>

        </div>

        <div id="historial"></div>

      </div>

    </div>

  </div>

  <!-- =========================
       🔻 NAVBAR
  ========================== -->

  <div class="navbar">

    <button
      onclick="cambiarTab('inicio')"
    >
      🏠
    </button>

    <button
      onclick="cambiarTab('productosTab')"
    >
      📦
    </button>

    <button
      onclick="cambiarTab('historialTab')"
    >
      📊
    </button>

  </div>

  <!-- =========================
       🔔 MENSAJE
  ========================== -->

  <div
    id="mensaje"
    class="mensaje"
  ></div>

  <script src="app.js"></script>

</body>

</html>
